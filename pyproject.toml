[project]
name = "mini-etl"
version = "0.1.0"
description = "A lightweight, memory-efficient streaming ETL framework"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "sudenazkocoglu", email = "sudenazkocoglu4@gmail.com" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.scripts]
mini-etl = "mini_etl.cli:app"
